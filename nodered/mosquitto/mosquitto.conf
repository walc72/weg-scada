# Configuracion por listener: el listener interno (red Docker) es abierto,
# el websocket expuesto via nginx queda solo-lectura por ACL.
per_listener_settings true

# ─── Listener interno (red Docker): poller y weg-api publican aca ───
listener 1883
allow_anonymous true

# ─── WebSocket para el frontend (proxeado por nginx en /mqtt) ───
# Solo lectura de topicos weg/# — nadie puede inyectar datos desde afuera.
listener 9001
protocol websockets
allow_anonymous true
acl_file /mosquitto/config/acl-websocket.conf

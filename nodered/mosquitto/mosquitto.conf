# Configuracion por listener: el listener interno (red Docker) pide usuario,
# el websocket expuesto via weg-api queda solo-lectura por ACL.
# arranque.sh activa las lineas #AUTH (con MQTT_PASSWORD) o #ANON (sin ella).
per_listener_settings true

# ─── Listener interno (red Docker): poller, weg-api y weg-replica publican aca ───
listener 1883
#AUTH allow_anonymous false
#AUTH password_file /mosquitto/passwd
#ANON allow_anonymous true

# ─── WebSocket para el frontend (proxeado por weg-api en /mqtt, con token) ───
# Solo lectura de topicos weg/# — nadie puede inyectar datos desde afuera.
listener 9001
protocol websockets
allow_anonymous true
acl_file /mosquitto/config/acl-websocket.conf

##############################################################################
# WEG Monitoring Stack - Docker Compose
# React SCADA (nginx) + weg-api + modbus-poller + InfluxDB 2.x + Grafana
# + Mosquitto
#
# Usage:
#   cp .env.example .env   # fill in your credentials
#   docker compose up -d
#
# Access:
#   React SCADA:         http://localhost:9090
#   Grafana:             http://localhost:3000
#   InfluxDB:            http://127.0.0.1:8086 (solo loopback)
#
# Stop:
#   docker compose down
#
# View logs:
#   docker compose logs -f weg-api modbus-poller
##############################################################################

networks:
  weg-network:
    driver: bridge

volumes:
  influxdb-data:
    driver: local
  influxdb-config:
    driver: local
  grafana-data:
    driver: local
  mosquitto-data:
    driver: local
  mosquitto-log:
    driver: local

services:

  ##########################################################################
  # INFLUXDB 2.x - Time-series database
  ##########################################################################
  influxdb:
    image: influxdb:2.7
    container_name: weg-influxdb
    restart: unless-stopped
    networks:
      - weg-network
    ports:
      # Solo loopback: los contenedores llegan via red interna; para admin
      # remoto usar tunel SSH/Tailscale (issue de seguridad: no exponer en 0.0.0.0)
      - "127.0.0.1:8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    environment:
      - TZ=${TZ:-America/Mexico_City}
      # --- Auto-setup on first run ---
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_USERNAME:-admin}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG:-WEG_Monitoring}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET:-weg_drives}
      - DOCKER_INFLUXDB_INIT_RETENTION=365d
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN}
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  ##########################################################################
  # GRAFANA - Advanced dashboards & alerting
  ##########################################################################
  grafana:
    image: grafana/grafana-oss:11.6.0
    container_name: weg-grafana
    restart: unless-stopped
    networks:
      - weg-network
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - TZ=${TZ:-America/Mexico_City}
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD}
      # Token del datasource provisionado (grafana/provisioning/datasources/influxdb.yml)
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - GF_INSTALL_PLUGINS=
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/weg-overview.json
      # --- SMTP for email alerts ---
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.gmail.com:587
      - GF_SMTP_USER=${GF_SMTP_USER}
      - GF_SMTP_PASSWORD=${GF_SMTP_PASSWORD}
      - GF_SMTP_FROM_ADDRESS=${GF_SMTP_FROM}
      - GF_SMTP_FROM_NAME=WEG Monitoring
      # --- Alerting ---
      - GF_UNIFIED_ALERTING_ENABLED=true
      # Anonymous auth DESHABILITADO (issue #7) - requiere login para ver dashboards
      - GF_AUTH_ANONYMOUS_ENABLED=false
    depends_on:
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  ##########################################################################
  # TAILSCALE - Instalado directamente en el host (no en Docker)
  # El host corre: tailscale up --accept-routes --accept-dns=false
  # La ruta 192.168.10.0/24 queda disponible para todos los contenedores
  # via la red bridge de Docker que comparte la tabla de rutas del host.
  ##########################################################################
  # tailscale: (disabled - runs on host)

  ##########################################################################
  # MOSQUITTO - MQTT Broker
  ##########################################################################
  mosquitto:
    image: eclipse-mosquitto:2.0.21
    container_name: weg-mosquitto
    restart: unless-stopped
    networks:
      - weg-network
    # Sin puertos publicados: 1883 es interno (red Docker) y el websocket 9001
    # se accede via nginx en /mqtt (solo lectura por ACL)
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto/acl-websocket.conf:/mosquitto/config/acl-websocket.conf
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

  ##########################################################################
  # WEG MODBUS POLLER - Standalone Modbus TCP polling service
  # Reads all WEG drives via Modbus, publishes to MQTT + writes InfluxDB
  # Config: ./weg-modbus-poller/config.json (hot-reload on change)
  ##########################################################################
  modbus-poller:
    build: ./weg-modbus-poller
    container_name: weg-modbus-poller
    restart: unless-stopped
    networks:
      - weg-network
    volumes:
      - ./config:/app/config
    environment:
      - TZ=${TZ:-America/Mexico_City}
      - CONFIG_PATH=/app/config/config.json
      - MQTT_BROKER=mqtt://mosquitto:1883
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
    depends_on:
      mosquitto:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "try{require('fs').readFileSync('/tmp/poller-healthy');process.exit(0)}catch(e){process.exit(1)}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  ##########################################################################
  # WEG API - REST API for config, setpoints, alerts, reports
  ##########################################################################
  weg-api:
    build: ./weg-api
    command: ["node", "src/server.js"]
    container_name: weg-api
    restart: unless-stopped
    networks:
      - weg-network
    ports:
      # Solo loopback: el frontend llega via nginx (/api); no exponer en 0.0.0.0
      - "127.0.0.1:3200:3200"
    volumes:
      - ./config:/app/config
    environment:
      - TZ=${TZ:-America/Mexico_City}
      - PORT=3200
      - CONFIG_PATH=/app/config/config.json
      - MQTT_BROKER=mqtt://mosquitto:1883
      - POLLER_URL=http://modbus-poller:3100
      # Token de Influx para los reportes (prioridad sobre config.json)
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      # Auth (issue #5, #6)
      - AUTH_USER=${AUTH_USER:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD}
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-*}
      # Alert notifications (optional, configure when ready)
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=${GF_SMTP_USER:-}
      - SMTP_PASS=${GF_SMTP_PASSWORD:-}
      - ALERT_EMAIL=${ALERT_EMAIL:-}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    depends_on:
      mosquitto:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 explicito: en la imagen, localhost resuelve a ::1 y el
      # server escucha solo IPv4 — con localhost el check daba refused
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3200/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  ##########################################################################
  # FRONTEND (React SCADA) - Nginx serving built React app
  # Access: http://<server-ip>:8080
  # /api/* proxied to weg-api:3200
  ##########################################################################
  frontend:
    image: nginx:1.27-alpine
    container_name: weg-frontend
    restart: unless-stopped
    networks:
      - weg-network
    ports:
      - "9090:80"
    volumes:
      - ../frontend-react/dist:/usr/share/nginx/html:ro
      - ./nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - weg-api
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Seguridad: sin versión de nginx, sin embeber el portal en sitios ajenos, sin adivinar tipos.
    # Ninguna location usa add_header (si una lo hiciera, dejaría de heredar estas).
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    # CSP: scripts, fuentes y conexiones (API y websocket /mqtt) solo del mismo origen. Si se cuela un
    # script, no puede cargar código de afuera ni mandar el token a otro sitio.
    # style 'unsafe-inline': sonner y radix inyectan <style>. img data:/blob: QR, logo y exportar a imagen.
    # worker-src blob: mqtt.js arma un worker para los timers del keepalive (si no, en segundo plano se corta).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # Compresión: el JS/CSS del portal y el JSON de la API (históricos, configuración)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Resolver Docker DNS + variable para que nginx re-resuelva en cada request
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://weg-api:3200;

    # Proxy /api/* to weg-api (no trailing slash = path preserved as-is)
    location /api/ {
        client_max_body_size 2m;  # PUT del unifilar (hasta 2 MB); el default de nginx es 1 MB
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Backups: "Probar" un destino espera a weg-backup hasta 55 s (la API corta ahí); el default de 60 s
    # de nginx no deja margen. Mismo proxy que /api/ con más tiempo de lectura.
    # Sin barra final: con /api/backup/ nginx redirige /api/backup (301) a una URL sin el puerto (:9090 → :80).
    location /api/backup {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 90s;
    }

    # MQTT sobre WebSocket: pasa por weg-api, que exige token (sesión o réplica)
    # y corta la conexión al revocar/cerrar sesión. Sin access log: la URL del
    # navegador lleva ?token=. error_log solo crit por la misma razón.
    # Regex sin distinguir mayúsculas: /MQTT o /mqtt/ también llegan a weg-api.
    location ~* ^/mqtt/?$ {
        access_log off;
        error_log /var/log/nginx/error.log crit;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback — all unmatched routes → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets con hash: caché de 1 año; index.html se revalida siempre.
    # Con `expires` y no con add_header, así heredan las cabeceras de seguridad.
    location ~* \.(?:js|css|woff2?|png|jpg|svg|ico)$ {
        expires 1y;
    }
    location = /index.html {
        expires -1;
    }
}

# Dependabot: PRs semanales, menores/parches agrupados por ecosistema; las mayores vienen sueltas.
# Parches y menores con el CI en verde se mergean solos (workflows/dependabot-auto.yml); las mayores
# y los paquetes sensibles se revisan a mano. Nada se despliega solo en planta.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /frontend-react
      - /nodered/weg-api
      - /nodered/weg-modbus-poller
      - /nodered/weg-replica
      - /nodered/weg-agent
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/Asuncion }
    open-pull-requests-limit: 8
    commit-message: { prefix: "chore(deps)" }
    ignore:
      # Los tipos de Node siguen a la versión que corre (node:22-alpine); se suben a mano con ella
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    groups:
      menores-npm:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /frontend-react
      - /nodered/weg-api
      - /nodered/weg-modbus-poller
      - /nodered/weg-replica
      - /nodered/weg-agent
      - /nodered/weg-backup
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/Asuncion }
    commit-message: { prefix: "chore(docker)" }
    ignore:
      # Node impar = sin LTS y soporte corto; en producción solo LTS (22, 24, 26...)
      - dependency-name: node
        versions: ["23.x", "25.x", "27.x", "29.x"]
    groups:
      menores-docker:
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directory: /nodered
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/Asuncion }
    commit-message: { prefix: "chore(docker)" }
    ignore:
      # InfluxDB 3 es otro producto (sin Flux ni la API v2 que usa el stack)
      - dependency-name: influxdb
        update-types: [version-update:semver-major]
    groups:
      menores-compose:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: "chore(ci)" }
    groups:
      acciones:
        patterns: ["*"]

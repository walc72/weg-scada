name: CI

on:
  push:
    branches: [master, feature/*]
  pull_request:
    branches: [master]

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - run: npm ci --ignore-scripts
      # Solo lo que viaja a producción; las de desarrollo no llegan a planta
      - run: npm audit --omit=dev --audit-level=high
      - run: npx tsc -b
      - run: npx eslint src
      - run: npx vitest run
      - run: npx vite build

  build-api:
    name: Build API Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t weg-api ./nodered/weg-api

  build-poller:
    name: Build Poller Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t modbus-poller ./nodered/weg-modbus-poller

  packaging:
    name: Paquete de instalación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash -n packaging/install.sh && bash -n packaging/weg-scada
      - run: bash packaging/make-release.sh ci out
      - name: El compose del paquete es válido
        run: |
          mkdir -p t && tar xzf out/weg-scada-ci.tar.gz -C t && cd t/weg-scada
          WEG_VERSION=ci docker compose config -q
          WEG_VERSION=ci docker compose -f docker-compose.yml -f docker-compose.replica.yml config -q

  test-backup:
    name: Tests weg-backup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: >
          docker run --rm -v "$PWD:/repo" alpine:3.20 sh -c
          "apk add -q bash tar openssl jq coreutils procps rclone openssh-client >/dev/null
          && bash /repo/nodered/weg-backup/test/run.sh"
      - run: docker build -q ./nodered/weg-backup

  tests:
    name: Tests (weg-api y poller)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: cd nodered/weg-api && npm ci --ignore-scripts --no-fund && npm audit --omit=dev --audit-level=high && npm test
      - run: cd nodered/weg-modbus-poller && npm ci --ignore-scripts --no-fund && npm audit --omit=dev --audit-level=high && npm test
      - run: cd nodered/weg-replica && npm ci --ignore-scripts --no-fund && npm audit --omit=dev --audit-level=high && npm test
      - run: node --test .github/scripts

name: Release

# Al pushear un tag vX.Y.Z: construye y publica las imágenes en ghcr.io y sube
# al release el paquete de instalación (weg-scada-<ver>.tar.gz) e install.sh.
# A mano (workflow_dispatch): publica las imágenes con la etiqueta indicada
# (p.ej. "edge") y deja el paquete como artifact, sin tocar releases.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Etiqueta de las imágenes (p.ej. edge)'
        required: true
        default: edge

permissions:
  contents: write
  packages: write

env:
  VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}

jobs:
  images:
    name: Imagen ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: api,      context: nodered/weg-api }
          - { name: poller,   context: nodered/weg-modbus-poller }
          - { name: agent,    context: nodered/weg-agent }
          - { name: backup,   context: nodered/weg-backup }
          - { name: replica,  context: nodered/weg-replica }
          - { name: frontend, context: frontend-react }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Etiquetas
        id: tags
        run: |
          img="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/weg-scada-${{ matrix.name }}"
          tags="$img:$VERSION"
          # :latest solo para releases estables (vX.Y.Z sin sufijo)
          if [[ "$GITHUB_EVENT_NAME" == push && "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then tags="$tags,$img:latest"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  bundle:
    name: Paquete de instalación
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash packaging/make-release.sh "$VERSION" out
      - name: Subir al release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            pre=""; [[ "$VERSION" == *-* ]] && pre="--prerelease"
            gh release create "$VERSION" --title "$VERSION" --generate-notes $pre
          fi
          gh release upload "$VERSION" out/* --clobber
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'push'
        with:
          name: weg-scada-${{ env.VERSION }}
          path: out/
